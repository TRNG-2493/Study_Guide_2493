[pytest]
testpaths = tests
python_files = test_*.py
# --strict-markers: a typo in a marker name becomes an error (Monday).
# -m "not live": the public-site tests only run when you ask for them: pytest -m live
addopts = -ra --strict-markers -m "not live"
markers =
    offline: runs against the offline GadgetHub practice site (no internet needed)
    live: runs against the public https://www.saucedemo.com site (internet needed, stretch)
    project1: the three Project 1 milestone scenarios (login ok, login fail, find product)
