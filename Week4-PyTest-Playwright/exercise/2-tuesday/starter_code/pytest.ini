[pytest]
# 'pythonpath' lets tests do `from defect_log import DefectLog` without installing anything.
pythonpath = src
testpaths = tests
# Monday: --strict-markers turns a typo'd marker into an error; -ra summarises skips/xfails/fails.
addopts = --strict-markers -ra
markers =
    smoke: fast sanity checks, run before every commit
    regression: broader checks, run nightly or before release
    boundary: boundary-value tests
    slow: tests that take noticeable time
