[pytest]
# Wednesday: config lives in pytest.ini. --strict-markers turns a typo'd marker into an error.
addopts = -ra --strict-markers
testpaths = tests
pythonpath = .
markers =
    data: fast checks on the catalog itself (no browser needed)
    catalog: browser checks that verify catalog rows against the page
    smoke: the quickest "is everything alive?" checks
    css: verifies the CSS selector of a row
    xpath: verifies the XPath selector of a row
    login: rows/tests about the login page
    inventory: rows/tests about the product page
    live_only: needs https://www.saucedemo.com (skipped when SITE=local)
    stretch: stretch tasks
