[pytest]
# Starter stub. You will extend this file in Tasks 6 and 7.
# pythonpath lets tests write: from pages.login_page import LoginPage
pythonpath = .
testpaths = tests
base_url = http://127.0.0.1:8791

# Demo-only tests are skipped by default; you run them on purpose in Tasks 6 and 7.
addopts = -m "not retry_demo and not fails_on_purpose"

markers =
    smoke: quick checks, run on every commit
    regression: full coverage
    retry_demo: deliberately flaky test used to show --reruns
    fails_on_purpose: deliberately failing test used to show report evidence

