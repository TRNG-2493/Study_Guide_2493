<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Practice Store - Log in</title></head>
<body>
  <h1>Practice Store</h1>
  <h2>Log in</h2>
  <label for="username">Username</label>
  <input id="username" type="text">
  <label for="password">Password</label>
  <input id="password" type="password">
  <button id="login">Log in</button>
  <p id="error" role="alert"></p>

  <script>
    document.querySelector("#login").addEventListener("click", () => {
      const user = document.querySelector("#username").value;
      const pass = document.querySelector("#password").value;
      const error = document.querySelector("#error");
      error.textContent = "";
      setTimeout(() => {
        if (!user) { error.textContent = "Username is required"; return; }
        if (!pass) { error.textContent = "Password is required"; return; }
        if (pass !== "secret123" || !["student", "locked"].includes(user)) {
          error.textContent = "Invalid username or password"; return;
        }
        if (user === "locked") {
          error.textContent = "Sorry, this user has been locked out"; return;
        }
        localStorage.setItem("user", user);
        location.href = "products.html";
      }, 500);
    });
  </script>
</body>
</html>

<!-- Logins: student / secret123 (works), locked / secret123 (locked out) -->
