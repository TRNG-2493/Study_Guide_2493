<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopFront - Office and home supplies</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="top">
  <div class="logo">ShopFront</div>
  <nav aria-label="Primary"><a href="#products">Products</a> <a href="#newsletter">Newsletter</a></nav>
  <div role="search"><label for="search">Search products</label>
  <input id="search" class="search" type="text" placeholder="Search"></div>
  <div class="cart">Cart: <span id="cart-count" role="status">0</span></div>
</header>
<main id="main" class="content">
  <h1>ShopFront</h1>
  <div class="hero"><img src="img/placeholder.svg" width="120" height="80" alt=""> Spring sale: up to 30% off office supplies</div>
  <h2>Products</h2>
  <div id="status" role="status">Loading products...</div>
  <div id="products" class="grid"></div>
  <div class="promo">
    <label for="promo">Promo code</label>
    <input id="promo" type="text">
  </div>
  <section id="newsletter" aria-labelledby="nl-h">
    <h2 id="nl-h">Newsletter</h2>
    <label for="email">Email address</label>
    <input id="email" type="text" autocomplete="email" aria-describedby="email-error">
    <button id="subscribe" type="button">Subscribe</button>
    <div id="email-error" class="err" role="alert"></div>
    <div id="email-ok" role="status"></div>
  </section>
</main>
<footer class="foot">(c) ShopFront demo store</footer>
<script src="app.js"></script>
</body>
</html>
