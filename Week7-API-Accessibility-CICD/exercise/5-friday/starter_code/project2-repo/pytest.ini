[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    smoke: fast checks that prove the API is alive
    regression: full behaviour checks
    live: needs the real API (skipped when API_MODE=mock or the API is unreachable)
    mock: runs fully offline against the `responses` library
    a11y: accessibility scans and keyboard checks (Playwright + axe)
    mcp: MCP in-memory protocol tests (pytest-asyncio)
